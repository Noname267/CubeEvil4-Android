name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install SDK parts
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358" > /dev/null

    - name: Install core build tools and NDK r28c
      run: sudo port/tools/whole_setup_linux.sh --android

    - name: Build the game core
      run: port/tools/whole_build_android.sh --abi all

    - name: Grant execute permission for gradlew
      run: chmod +x port/android-decomp/gradlew

    - name: Build the app
      working-directory: port/android-decomp
      run: ./gradlew assembleCoreDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CubeEvil4-debug-apk
        path: port/android-decomp/app/build/outputs/apk/core/debug/*.apk
